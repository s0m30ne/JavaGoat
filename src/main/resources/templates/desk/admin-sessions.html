<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{common/common::head}"></div>
<style>
    .session-page { max-width: 920px; margin: 0 auto; }
    .hero, .block {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
    }
    .hero { padding: 20px 24px; margin-bottom: 16px; }
    .hero h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    .hero p { margin: 0; color: #6b7280; line-height: 1.7; font-size: 13px; }
    .block { padding: 18px 20px 20px; }
    .block h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
</style>
<body>
<div class="layui-fluid session-page">
    <div class="hero">
        <h2>会话与登录</h2>
        <p>查看当前登录会话状态。注销后会话立即失效，需要重新登录。</p>
    </div>
    <div class="block">
        <h3>当前会话</h3>
        <table class="layui-table">
            <tbody>
            <tr><td width="160">登录账号</td><td th:text="${principal}"></td></tr>
            <tr><td>会话 ID</td><td th:text="${sessionId}"></td></tr>
            <tr><td>来源地址</td><td th:text="${remote}"></td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
