<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{common/common::head}"></div>
<style>
    .report-page { max-width: 920px; margin: 0 auto; }
    .report-page form { display: block; width: auto; }
    .report-page form input, .report-page form textarea { margin-right: 0; }
    .hero, .block {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
    }
    .hero { padding: 20px 24px; margin-bottom: 16px; }
    .hero h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; text-wrap: balance; }
    .hero p { margin: 0; color: #6b7280; line-height: 1.7; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .block { padding: 18px 20px 20px; }
    .block h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .hint { color: #8b95a5; font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
    .hint code { background: #f4f6f8; padding: 0 4px; border-radius: 4px; }
    .layui-textarea { min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .actions { margin-top: 12px; }
    .layui-btn { transition: transform 120ms cubic-bezier(0.2, 0, 0, 1); }
    .layui-btn:active { transform: scale(0.96); }
    .result {
        margin-top: 16px;
        background: #0f172a;
        color: #e5e7eb;
        border-radius: 10px;
        padding: 12px 14px;
        min-height: 72px;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        display: none;
    }
    .result.show { display: block; }
    .result.ok { box-shadow: inset 0 0 0 1px rgba(46, 204, 113, .35); }
    .result.err { box-shadow: inset 0 0 0 1px rgba(231, 76, 60, .45); }
</style>
<body>
<div class="layui-fluid report-page">
    <div class="hero">
        <h2>服务台报表</h2>
        <p>用过滤表达式计算统计指标，或预览通知脚本在发送前的输出。表达式按服务端规则求值，脚本在预览环境执行。</p>
    </div>
    <div class="grid">
        <div class="block">
            <h3>过滤表达式</h3>
            <div class="hint">例如工单量汇总：<code>3+1</code>。结果用于报表卡片和导出。</div>
            <form onsubmit="return runFilter(this);">
                <input class="layui-input" name="expr" placeholder="输入过滤表达式" autocomplete="off">
                <div class="actions">
                    <button class="layui-btn layui-btn-normal" type="submit">计算</button>
                </div>
            </form>
        </div>
        <div class="block">
            <h3>通知脚本预览</h3>
            <div class="hint">发送工单通知前可预览脚本输出，确认文案和变量替换是否正确。</div>
            <form onsubmit="return runScript(this);">
                <textarea class="layui-textarea" name="script" placeholder="通知脚本"></textarea>
                <div class="actions">
                    <button class="layui-btn" type="submit">预览输出</button>
                </div>
            </form>
        </div>
    </div>
    <pre class="result" id="reportResult"></pre>
</div>
<script>
    function showResult(text, ok) {
        var el = document.getElementById('reportResult');
        el.textContent = text || '';
        el.className = 'result show ' + (ok ? 'ok' : 'err');
    }
    function runFilter(form) {
        var expr = form.expr.value || '';
        fetch('/admin/reports/filter?expr=' + encodeURIComponent(expr))
            .then(function (r) { return r.text().then(function (t) { showResult(t, r.ok); }); })
            .catch(function (e) { showResult(String(e), false); });
        return false;
    }
    function runScript(form) {
        var params = new URLSearchParams();
        params.append('script', form.script.value || '');
        fetch('/admin/notify-script', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        }).then(function (r) { return r.text().then(function (t) { showResult(t, r.ok); }); })
          .catch(function (e) { showResult(String(e), false); });
        return false;
    }
</script>
</body>
</html>
