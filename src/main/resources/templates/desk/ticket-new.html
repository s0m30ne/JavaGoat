<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{common/common::head}"></div>
<style>
    .desk-form form { display: block; width: auto; }
    .desk-form form input { margin-right: 0; }
    .desk-form .layui-form-label { width: 110px; }
    .desk-form .layui-input-block { margin-left: 140px; max-width: 860px; }
    .desk-form .layui-form-label.required:after { content: '*'; color: #ff5722; margin-left: 4px; }
    .edui-default { z-index: 1 !important; }
</style>
<body>
<div class="layui-fluid desk-form">
    <div class="layui-card">
        <div class="layui-card-header">新建工单</div>
        <div class="layui-card-body">
            <p th:if="${error != null}" style="color:#ff5722;margin:0 0 12px 140px;" th:text="${error}"></p>
            <form class="layui-form" method="post" th:action="@{/tickets/create}" lay-filter="ticketForm" onsubmit="return syncTicketEditor();">
                <div class="layui-form-item">
                    <label class="layui-form-label required">工单标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="title" lay-verify="required" placeholder="请简要描述问题，例如：邮箱无法登录" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label required">问题分类</label>
                        <div class="layui-input-inline" style="width: 200px;">
                            <select name="category" lay-verify="required">
                                <option value="">请选择分类</option>
                                <option value="email">邮箱</option>
                                <option value="network">网络/VPN</option>
                                <option value="account">账号权限</option>
                                <option value="hardware">硬件设备</option>
                                <option value="software">软件应用</option>
                                <option value="general" selected>其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label required">优先级</label>
                        <div class="layui-input-inline" style="width: 200px;">
                            <select name="priority" lay-verify="required">
                                <option value="high">高</option>
                                <option value="medium" selected>中</option>
                                <option value="low">低</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">指定处理人</label>
                    <div class="layui-input-block">
                        <input type="text" name="assignee" placeholder="可选，填写处理人账号，如 agent" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label required">问题描述</label>
                    <div class="layui-input-block">
                        <textarea id="content" name="content" style="display:none;"></textarea>
                        <script id="ticketEditor" type="text/plain" style="width:100%;height:360px;"></script>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn layui-btn-normal" lay-submit>提交工单</button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/lib/jquery-3.4.1/jquery-3.4.1.min.js}"></script>
<script th:src="@{/lib/layui-v2.6.3/layui.js}"></script>
<script>window.UEDITOR_HOME_URL = '/lib/ueditor/';</script>
<script type="text/javascript" charset="utf-8" src="/lib/ueditor/ueditor.config.js"></script>
<script type="text/javascript" charset="utf-8" src="/lib/ueditor/ueditor.all.min.js"></script>
<script type="text/javascript" charset="utf-8" src="/lib/ueditor/lang/zh-cn/zh-cn.js"></script>
<script type="text/javascript">
    UE.Editor.prototype._bkGetActionUrl = UE.Editor.prototype.getActionUrl;
    UE.Editor.prototype.getActionUrl = function (action) {
        if (action === 'uploadimage' || action === 'uploadfile' || action === 'uploadscrawl') {
            return '/ueditor/upload';
        }
        return this._bkGetActionUrl.call(this, action);
    };
    var ticketEditor = UE.getEditor('ticketEditor', {
        initialFrameWidth: '100%',
        initialFrameHeight: 360,
        autoHeightEnabled: false
    });
    function syncTicketEditor() {
        document.getElementById('content').value = ticketEditor.getContent();
        return true;
    }
    layui.use(['form'], function () {
        layui.form.render();
    });
</script>
</body>
</html>
