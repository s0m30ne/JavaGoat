<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{common/common::head}"></div>
<body>
<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">工单列表</div>
        <div class="layui-card-body">
            <p th:if="${error != null}" style="color:#ff5722;margin-bottom:12px;" th:text="${error}"></p>
            <form class="layui-form" method="get" th:action="@{/tickets/search}">
                <div class="layui-inline">
                    <input class="layui-input" name="q" th:value="${q}" placeholder="标题/内容/分类">
                </div>
                <div class="layui-inline">
                    <input class="layui-input" name="orderBy" th:value="${orderBy}" placeholder="排序字段，如 id">
                </div>
                <button class="layui-btn" type="submit">高级搜索</button>
            </form>
            <table class="layui-table">
                <thead>
                <tr><th>ID</th><th>标题</th><th>状态</th><th>优先级</th><th>分类</th><th>提单人</th><th>处理人</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tickets}">
                    <td th:text="${t.id}"></td>
                    <td><a th:href="@{/tickets/{id}(id=${t.id})}" th:text="${t.title}"></a></td>
                    <td th:text="${t.status}"></td>
                    <td th:text="${t.priority}"></td>
                    <td th:text="${t.category}"></td>
                    <td th:text="${t.reporter}"></td>
                    <td th:text="${t.assignee}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
